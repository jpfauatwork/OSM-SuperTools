name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.2.0). Must already exist."
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Build add-on package
        run: ./build.sh

      - name: Verify tag matches manifest version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          MANIFEST_VERSION=$(grep -m1 '"version"' manifest.json \
            | sed -E 's/.*"version"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/')
          if [ "$TAG" != "v$MANIFEST_VERSION" ]; then
            echo "::error::Tag $TAG does not match manifest version v$MANIFEST_VERSION"
            exit 1
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          gh release create "$TAG" \
            --title "OSM SuperTools $TAG" \
            --generate-notes \
            web-ext-artifacts/*.xpi \
            web-ext-artifacts/*.zip
